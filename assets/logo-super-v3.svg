<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="goldHex" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 14)">
    <!-- Изометрический шестигранник (межевой репер наивысшего класса точности) -->
    <path d="M 52 6 L 86 24 L 86 60 L 52 78 L 18 60 L 18 24 Z" stroke="#1E293B" stroke-width="2" fill="#0B132B"/>
    <!-- Внутренние грани объема: массивная кириллическая М -->
    <path d="M 28 60 L 28 26 L 44 46 L 52 36 L 60 46 L 76 26 L 76 60" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Контрастная золотая русская Л в сердце знака -->
    <path d="M 36 62 L 52 28 L 68 62" stroke="url(#goldHex)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Поворотные реперные точки -->
    <circle cx="52" cy="6" r="3" fill="url(#goldHex)"/>
    <circle cx="86" cy="24" r="3" fill="#D4AF37"/>
    <circle cx="18" cy="24" r="3" fill="#D4AF37"/>
  </g>
  <g transform="translate(120, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#goldHex)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ИНЖЕНЕРНО-ПРАВОВЫЕ РЕШЕНИЯ
    </text>
  </g>
</svg>