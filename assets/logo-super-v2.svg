<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="goldPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 14)">
    <!-- Внешний восьмигранный оптический безель геодезического нивелира -->
    <polygon points="38,4 66,4 84,22 84,50 66,68 38,68 20,50 20,22" stroke="#334155" stroke-width="2" fill="#0F172A"/>
    <!-- Оптические риски шкал -->
    <line x1="52" y1="4" x2="52" y2="12" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="52" y1="60" x2="52" y2="68" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="20" y1="36" x2="28" y2="36" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="76" y1="36" x2="84" y2="36" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Внутри: ювелирно выточенная русская лигатура М+Л из драгоценного металла -->
    <!-- Левая стойка и диагонали М -->
    <path d="M 30 56 L 30 22 L 42 38 L 52 24 L 62 38 L 72 22 L 72 56" stroke="url(#goldPrism)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Четкая шатровая кириллическая Л, смыкающая центр в пик -->
    <path d="M 40 56 L 52 24 L 64 56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="36" r="3" fill="url(#cyanLaser)"/>
  </g>
  <g transform="translate(120, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#goldPrism)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ЦЕНТР ЭКСПЕРТНОГО КАДАСТРА
    </text>
  </g>
</svg>