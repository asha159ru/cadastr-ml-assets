<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="gGold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#936D08"/>
    </linearGradient>
    <linearGradient id="gSteel4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 12)">
    <!-- Рамка геодезического планшета с открытыми реперными углами -->
    <rect x="12" y="6" width="74" height="74" rx="14" fill="#0D1524" stroke="#22304A" stroke-width="2"/>
    <!-- Четкая, лаконичная русская буква М -->
    <path d="M 22 66 L 22 26 L 36 46 L 49 32 L 62 46 L 76 26 L 76 66" stroke="url(#gSteel4)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- Укрупненная, величественная кириллическая буква Л (высокая, мощная, из чистого золота) -->
    <path d="M 31 66 L 49 20 L 67 66" stroke="url(#gGold4)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Опорная база и высотный геодезический центр -->
    <circle cx="49" cy="20" r="3.5" fill="#FCE794"/>
    <circle cx="49" cy="20" r="1.5" fill="#0B0F17"/>
  </g>
  <g transform="translate(122, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#gGold4)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ИНЖЕНЕРНО-ПРАВОВЫЕ РЕШЕНИЯ
    </text>
  </g>
</svg>