<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="goldS1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE794"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#936D08"/>
    </linearGradient>
    <linearGradient id="metalS1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 14)">
    <!-- Левая стойка М (сталь/титан) -->
    <path d="M 8 70 L 8 16 L 22 16 L 22 70 Z" fill="url(#metalS1)"/>
    <!-- Диагонали М и перетекание в шатровую Л (монолитное архитектурное золото) -->
    <path d="M 22 16 L 38 46 L 54 16 L 68 16 L 46 60 L 32 60 Z" fill="url(#goldS1)"/>
    <!-- Правая грань М, образующая стойку шатровой русской Л -->
    <path d="M 54 16 L 68 16 L 86 70 L 72 70 L 61 36 L 54 50 Z" fill="url(#metalS1)"/>
    <!-- Левая опора Л со срезом геодезической засечки -->
    <path d="M 38 70 L 46 48 L 56 70 Z" fill="url(#goldS1)"/>
    <circle cx="38" cy="16" r="3.5" fill="#38BDF8"/>
  </g>
  <g transform="translate(120, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#goldS1)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ИНЖЕНЕРНО-ПРАВОВАЯ КОРПОРАЦИЯ
    </text>
  </g>
</svg>