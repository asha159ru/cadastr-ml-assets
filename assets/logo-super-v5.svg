<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="emeraldTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 14)">
    <!-- Внешний триангуляционный каркас -->
    <polygon points="48,8 86,72 10,72" stroke="#1E293B" stroke-width="2" fill="none"/>
    <!-- Мощная сдвоенная стрела: русская М в основании -->
    <path d="M 22 70 L 22 42 L 35 58 L 48 40 L 61 58 L 74 42 L 74 70" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Центральный монолитный пилон шатровой русской Л, прорезающий вершину триангуляции -->
    <path d="M 32 70 L 48 14 L 64 70" stroke="url(#goldLaser)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Лазерный маркер створа -->
    <circle cx="48" cy="14" r="3.5" fill="#10B981"/>
    <line x1="48" y1="2" x2="48" y2="8" stroke="#10B981" stroke-width="2"/>
  </g>
  <g transform="translate(120, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#goldLaser)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="url(#emeraldTech)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ИНЖЕНЕРНО-ПРАВОВЫЕ РЕШЕНИЯ
    </text>
  </g>
</svg>