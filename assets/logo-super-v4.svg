<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 14)">
    <!-- Рамка геодезического планшета -->
    <rect x="14" y="8" width="70" height="70" rx="12" fill="#131B2E" stroke="#22304A" stroke-width="2"/>
    <!-- Вырезы негативного пространства: русская М -->
    <path d="M 24 64 L 24 24 L 39 46 L 49 32 L 59 46 L 74 24 L 74 64" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Доминирующий золотой шатер кириллической Л со стрелой вектора вверх -->
    <path d="M 35 64 L 49 32 L 63 64" stroke="url(#goldPlate)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Точка стояния теодолита -->
    <circle cx="49" cy="20" r="3" fill="#D4AF37"/>
  </g>
  <g transform="translate(120, 32)">
    <text x="0" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="900" letter-spacing="3">
      КАДАСТР <tspan fill="url(#goldPlate)">МЛ</tspan>
    </text>
    <text x="1" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4.5">
      ЗЕМЕЛЬНО-ИМУЩЕСТВЕННЫЙ КОМПЛЕКС
    </text>
  </g>
</svg>